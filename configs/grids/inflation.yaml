# Sample-count spoofing: malicious clients REPORT 1,000,000 samples to the server (their real data is unchanged).
# Equal-weight FedAvg ignores the reported counts, so it is neutral to the lie BY CONSTRUCTION; the empirical questions are
# (a) how badly count-weighted FedAvg is hurt, alone and combined with a poisoning update, and (b) what equal weights cost when nobody lies.
# 5 corpora x (3 payloads x 2 weightings x 2 partitions) x 5 seeds = 300 runs.  malicious_fraction 0.2 (2 of 10 clients).
name: inflation
datasets: [unsw_nb15, cicids2017, cse_cic_ids2018, iot23, ton_iot]
seeds: [0, 1, 2, 3, 4]
base:
  dataset: {n_samples: 50000, test_fraction: 0.15, val_fraction: 0.15, eval_on: test, row_role: report, pool: all, feature_set: core, deduplicate: true}
  partitioning: {num_clients: 10, heldout_client_fraction: 0.0}
  model: {architecture: mlp, hidden_dims: [64, 32]}
  federated: {algorithm: fedavg, rounds: 20, clients_per_round: 10}
  defense: {type: none}
matrix:
  prefix: infl
  group: fedavg
  factors:
    payload:
      - {name: honest,    overrides: {attack: {type: sample_inflation, malicious_fraction: 0.2, reported_count: 1000000, combine_with: none}}}
      - {name: labelflip, overrides: {attack: {type: sample_inflation, malicious_fraction: 0.2, reported_count: 1000000, combine_with: label_flip}}}
      - {name: poison5,   overrides: {attack: {type: sample_inflation, malicious_fraction: 0.2, reported_count: 1000000, combine_with: model_poison, strength: 5.0}}}
    weights:
      - {name: weighted, overrides: {federated: {trust_client_sample_counts: true}}}
      - {name: uniform,  overrides: {federated: {trust_client_sample_counts: false}}}
    partition:
      - {name: dir0.5,    overrides: {partitioning: {strategy: dirichlet, alpha: 0.5}}}
      - {name: pareto1.5, overrides: {partitioning: {strategy: pareto, beta: 1.5}}}
